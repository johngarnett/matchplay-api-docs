# Test the site, then build it and publish to GitHub Pages.
#
# dist/ is deliberately gitignored — building here rather than committing output
# means the published site can never drift from the sources it came from.
#
# Requires a one-time repository setting: Settings -> Pages -> Source: GitHub Actions.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, so a half-published
# site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Everything that can say "this site is wrong" runs here, and the deploy waits
  # on it. Publishing first and finding out afterwards is the failure this job
  # exists to prevent — a broken internal link used to reach production because
  # only the unit tests gated the deploy.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Validates both specs, checks every committed fixture against the schema
      # that claims to describe it, and fails on an unresolvable {{schema:...}}
      # placeholder or a fixture containing a contact address.
      - name: Unit tests
        run: npm test

      # Only Chromium is needed, and caching the download keeps this to seconds
      # on repeat runs.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Renders the site and checks what the unit tests cannot: that every
      # internal link and anchor resolves, that wide tables scroll inside their
      # container rather than the page, and that both colour schemes work at
      # phone, tablet and desktop widths.
      #
      # Deliberately built without BASE_PATH. The link checker resolves
      # root-relative hrefs against files in dist/, which a subpath prefix would
      # break; applyBasePath is covered by unit tests instead.
      - name: Browser tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    # A pull request should be checked but not published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A project repo is served from /<repo>, so every root-relative link needs
      # prefixing. Drop this if the site ever moves to a custom domain, which
      # serves from the root.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /matchplay-api-docs

      # Pages must already be enabled on the repository. `enablement: true` looks
      # like it would handle that, but the default GITHUB_TOKEN cannot create a
      # Pages site ("Resource not accessible by integration") — it needs admin
      # rights the workflow token does not have. Enable it once instead, either
      # in Settings -> Pages -> Source: GitHub Actions, or with:
      #
      #     gh api -X POST /repos/OWNER/REPO/pages -f build_type=workflow
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
